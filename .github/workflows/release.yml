name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: alibaba-cloud-spend

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Build binary
        run: make

      - name: Build .deb package
        run: |
          chmod +x ci/linux-build-deb.sh
          ./ci/linux-build-deb.sh ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-amd64.deb

  build-windows:
    name: Build Windows (.exe installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-openssl
            python

      - name: Build binary
        run: |
          mingw32-make

      - name: Bundle DLLs
        run: |
          python ci/windows-bundle-dlls.py alibaba-cloud-spend.exe dist /ucrt64

      - name: Convert icon to ICO
        shell: pwsh
        run: |
          Install-Module -Name PSImageUtil -Force -Scope CurrentUser
          Import-Module PSImageUtil
          $pngPath = Resolve-Path "assets/icon-256.png"
          $icoPath = Resolve-Path "assets/icon-256.ico"
          New-Icon -Path $pngPath -OutputPath $icoPath

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;" + $env:PATH
          iscc ci/windows-installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/alibaba-cloud-spend-${{ steps.version.outputs.version }}-windows.exe

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          brew install gtk4 json-c pkg-config create-dmg

      - name: Build binary
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix json-c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          make

      - name: Create DMG
        run: |
          chmod +x ci/macos-create-dmg.sh
          ./ci/macos-create-dmg.sh ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: AlibabaCloudSpend-${{ steps.version.outputs.version }}-macos.dmg

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux-deb/*.deb
            artifacts/windows-installer/*.exe
            artifacts/macos-dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
